apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-assignments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-assignments
  template:
    metadata:
      labels:
        app: mysql-assignments
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "201504070"
            - name: MYSQL_DATABASE
              value: "assignments_db"
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-assignments
spec:
  selector:
    app: mysql-assignments
  ports:
    - port: 3306