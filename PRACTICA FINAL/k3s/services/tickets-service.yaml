apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickets-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tickets-service
  template:
    metadata:
      labels:
        app: tickets-service
    spec:
      containers:
        - name: tickets-service
          image: diegofacundopereznicolau/tickets-service:latest
          ports:
            - containerPort: 50053
          env:
            - name: DB_HOST
              value: mysql-tickets
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
---
apiVersion: v1
kind: Service
metadata:
  name: tickets-service
spec:
  selector:
    app: tickets-service
  ports:
    - port: 50053