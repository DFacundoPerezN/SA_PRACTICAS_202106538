apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: diegofacundopereznicolau/api-gateway:latest
          ports:
            - containerPort: 4000
          env:
            - name: AUTH_SERVICE_URL
              value: auth-service:50051
            - name: USERS_SERVICE_URL
              value: users-service:50052
            - name: TICKETS_SERVICE_URL
              value: tickets-service:50053
            - name: ASSIGNMENTS_SERVICE_URL
              value: assignments-service:50054
            - name: NOTIFICATION_SERVICE_URL
              value: notifications-service:50055
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 4000
      nodePort: 30007