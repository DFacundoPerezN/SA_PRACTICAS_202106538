apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignments-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assignments-service
  template:
    metadata:
      labels:
        app: assignments-service
    spec:
      containers:
        - name: assignments-service
          image: diegofacundopereznicolau/assignments-service:latest
          ports:
            - containerPort: 50054
          env:
            - name: DB_HOST
              value: mysql-assignments
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672
---
apiVersion: v1
kind: Service
metadata:
  name: assignments-service
spec:
  selector:
    app: assignments-service
  ports:
    - port: 50054