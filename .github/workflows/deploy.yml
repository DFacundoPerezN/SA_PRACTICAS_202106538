name: Deploy to GKE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Login Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build + Push imágenes
      - name: Build and push images
        run: |
          docker build -t diegofacundopereznicolau/auth-service:latest -f backend/Dockerfile.auth-service ./backend
          docker push diegofacundopereznicolau/auth-service:latest

          docker build -t diegofacundopereznicolau/users-service:latest -f backend/Dockerfile.users-service ./backend
          docker push diegofacundopereznicolau/users-service:latest

          docker build -t diegofacundopereznicolau/tickets-service:latest -f backend/Dockerfile.tickets-service ./backend
          docker push diegofacundopereznicolau/tickets-service:latest

          docker build -t diegofacundopereznicolau/assignments-service:latest -f backend/Dockerfile.assignments-service ./backend
          docker push diegofacundopereznicolau/assignments-service:latest

          docker build -t diegofacundopereznicolau/api-gateway:latest -f backend/Dockerfile.api-gateway ./backend
          docker push diegofacundopereznicolau/api-gateway:latest

          docker build -t diegofacundopereznicolau/frontend:latest ./frontend
          docker push diegofacundopereznicolau/frontend:latest

      # Autenticación GCP
      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Conectar al cluster
      - name: Get credentials
        run: |
          gcloud container clusters get-credentials tickets-cluster --zone us-central1-a

      # Deploy
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k3s/